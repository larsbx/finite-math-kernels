name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
      - uses: ./.github/actions/install-bend
      - run: pixi run test
        env:
          # every frontier kernel must run here; a missing toolchain fails, never skips
          FRONTIER_REQUIRE: mojo,rust,bend
