name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
      - uses: ./.github/actions/install-bend
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
      - name: Estate audit (pinned public artifact)
        run: |
          set -eu
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          pin=$(python3 -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          test "$rev" = "5ea47dec8086eab6a1dad6fd239688d20ea89891"
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/estate-audit.py "https://raw.githubusercontent.com/larsbx/estate-governance/$rev/kernel/audit_estate_layout.py"
          printf '%s  %s\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
          python3 /tmp/estate-audit.py --root .
      - run: pixi run test
        env:
          # every frontier kernel must run here; a missing toolchain fails, never skips
          FRONTIER_REQUIRE: mojo,rust,bend,julia
