name: Lean-MAX independent Lean gate

on:
  pull_request:
    paths:
      - "experiments/frontier/lean_max/**"
      - "tests/frontier/test_lean_max.py"
      - "tests/frontier/test_lean_max_trace.py"
      - ".github/workflows/lean-max-proof.yml"
  push:
    branches: [main]
    paths:
      - "experiments/frontier/lean_max/**"
      - "tests/frontier/test_lean_max.py"
      - "tests/frontier/test_lean_max_trace.py"
      - ".github/workflows/lean-max-proof.yml"

jobs:
  check-derived-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/frontier/lean_max
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/frontier/lean_max
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Generate and kernel-check the exact reconstructed proof
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --version
          python3 ../../../tests/frontier/test_lean_max_trace.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          import reference as ref
          from trace_codec import decode_trace, encode_trace

          problem = ref.Problem.parse(json.loads(Path("demo.json").read_text()))
          trace = encode_trace(problem, ref.construct(problem))
          trace_file = Path("/tmp/LeanMaxDemo.trace")
          trace_file.write_bytes(trace)
          reconstructed = ref.lean_source(problem, decode_trace(problem, trace_file.read_bytes()))
          if reconstructed != Path("Demo.lean").read_text():
              raise SystemExit("tracked fixture diverged from generated Lean")
          Path("/tmp/LeanMaxDemo.lean").write_text(reconstructed)
          PY
          lake env lean /tmp/LeanMaxDemo.lean
      - name: Lean must reject an invalid reconstructed proof
        shell: bash
        run: |
          set -euo pipefail
          sed 's/congrArg f p2/Eq.refl (f a)/' /tmp/LeanMaxDemo.lean > /tmp/LeanMaxForged.lean
          if cmp -s /tmp/LeanMaxForged.lean /tmp/LeanMaxDemo.lean; then
            echo "negative mutation was not applied" >&2
            exit 1
          fi
          if lake env lean /tmp/LeanMaxForged.lean; then
            echo "Lean unexpectedly accepted forged proof" >&2
            exit 1
          fi
