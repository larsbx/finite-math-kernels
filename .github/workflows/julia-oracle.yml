name: Julia oracle parallel gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  zq-transcript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out domain repository
        uses: actions/checkout@v4
        with:
          path: finite-math-kernels

      - name: Check out pinned Julia oracle
        uses: actions/checkout@v4
        with:
          repository: larsbx/julia-oracle-lab
          ref: d694949a5076cb7ffbd663baac4f536d3afa065e
          path: julia-oracle-lab

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: finite-math-kernels/pixi.toml

      - name: Set up MetaTest CI
        uses: ./finite-math-kernels/tools/external/metatest-ci

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Validate MetaTest CI inventory
        run: metatest-ci validate-manifest finite-math-kernels/metatest.ci.json

      - name: Run Julia differential gate through MetaTest
        run: metatest-ci run-manifest --manifest finite-math-kernels/metatest.ci.json --lane julia-zq-differential

      - name: Upload MetaTest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatest-julia-zq-differential
          path: .metatest/receipts/julia-zq-differential.json
          if-no-files-found: error
