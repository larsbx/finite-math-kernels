name: Install Bend 2
description: >
  Bend 2 for the frontier kernels, pinned by version and sha256 (the same check
  bend-lang.com/install.sh makes). CPU builds need clang >= 14.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BEND_VER: 2.0.25
        BEND_SHA256: 91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4
      run: |
        name="bend-$BEND_VER-linux-x64.tar.gz"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
          "https://github.com/bendlang/bend/releases/download/v$BEND_VER/$name"
        echo "$BEND_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
        mkdir -p "$HOME/.bend/bin"
        mv "$RUNNER_TEMP/bend/bend2" "$RUNNER_TEMP/bend/guide" "$HOME/.bend/"
        mv "$RUNNER_TEMP/bend/bin/bend" "$HOME/.bend/bin/bend"
        echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
        echo "BEND_NO_TELEMETRY=1" >> "$GITHUB_ENV"
