version = 1
template = "estate-repository-v1"

[repository]
id = "larsbx/finite-math-kernels"
kind = "library"
lifecycle = "active"
default_branch = "main"
layout_status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# policy/provenance.json pins where every tracked file came from.
[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "estate.toml"]

# Mojo include root (-I kernel). Packages here are vendored by consumers; paths inside them are package-relative.
[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "conformance"
authority = "evidence"
required = true
current = ["conformance"]

[[plane]]
id = "tests"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

# Includes claim_governance and vendoring, which consumers vendor under tools/.
[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["reference", "oracle", "audit", "proof_records", "generation"]
acceptance_authority = false

[[language]]
name = "Rust"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "Bend"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "Elixir"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "TLA+"
authority = "supporting"
roles = ["formal_model"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []

[governance]
repository = "larsbx/estate-governance"
revision = "bed4af2492dcf17dba2ed03fe429713dc4338da6"

[governance.sha256]
"docs/architecture/estate-repository-template-v1.md" = "30e308be494ac389ff3873cd13b070e22248b44e212c376564d645b6667958ae"
"tools/audit_estate_layout.py" = "c3e17cc08d03b64671f0477635e6c6eee86763ab3301fca936be08b9bd345550"
