[workspace]
name = "finite-math-kernels"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Modular nightly 2026-09-08: every MAX and Mojo package pinned to one build
# (tests/toolchain/test_modular_pins.py).
modular = "==26.6.0.dev2026090805"
max = "==26.6.0.dev2026090805"
max-core = "==26.6.0.dev2026090805"
max-serve = "==26.6.0.dev2026090805"
max-benchmark = "==26.6.0.dev2026090805"
mblack = "==26.6.0.dev2026090805"
mojo = "==1.1.0.dev2026090805"
mojo-compiler = "==1.1.0.dev2026090805"
mojo-python = "==1.1.0.dev2026090805"
python = ">=3.11"
pytest = "*"

[tasks]
property = "python oracles/property_oracle.py --layers zq"
replay = "python tools/replay_mojo.py"
provenance = "python tools/provenance.py --update"
ledgers = "python tools/make_ledger_example.py"
test-finite-exact = "mojo run -I kernel tests/finite_exact/test_finite_exact.mojo"
test-interval = "mojo run -I kernel tests/interval/test_interval_q.mojo"
test-linear-algebra = "mojo run -I kernel tests/finite_linear_algebra/test_finite_linear_algebra.mojo"
test-finite-polynomial = "mojo run -I kernel tests/finite_polynomial/test_polynomial_z.mojo"
test-cyclotomic-q = "mojo run -I kernel tests/finite_polynomial/test_cyclotomic_q.mojo"
test-quadratic-germ = "mojo run -I kernel tests/finite_polynomial/test_quadratic_germ.mojo"
test-integer-module = "mojo run -I kernel tests/finite_linear_algebra/test_integer_module.mojo"
test-madic = "mojo run -I kernel tests/finite_linear_algebra/test_madic_ball.mojo"
test-qpoly = "mojo run -I kernel tests/finite_linear_algebra/test_qpoly.mojo"
test-qpoly-oracle = "python -m pytest -q tests/finite_linear_algebra/test_qpoly_reference.py"
test-madic-oracle = "python -m pytest -q tests/finite_linear_algebra/test_madic_oracle.py"
test-substitution = "mojo run -I kernel tests/substitution_dynamics/test_substitution_dynamics.mojo"
test-tuning = "mojo run -I kernel tests/substitution_dynamics/test_tuning.mojo"
test-facades = "mojo run -I kernel tests/facades/test_stable_facades.mojo"
test-quadratic-orbit = "mojo run -I kernel tests/quadratic_orbit/test_quadratic_orbit.mojo && mojo run -I kernel tests/quadratic_orbit/test_escape_criterion.mojo"
test-rational-dynamics = "mojo run -I kernel tests/rational_dynamics/test_rational_dynamics.mojo"
test-projective-limits = "mojo run -I kernel tests/projective_limits/test_projective_limits.mojo && mojo run -I kernel tests/projective_limits/test_reference_vectors.mojo && mojo run -I kernel tests/projective_limits/test_field_generic.mojo && mojo run -I kernel tests/projective_limits/test_rotor.mojo"
projective-limits-vectors = "python tools/make_projective_limits_vectors.py"
test-certified-records = "mojo run -I kernel tests/certified_records/test_certified_records.mojo"
build-certified-records-py = "mkdir -p .build && mojo build -I kernel kernel/certified_records/python_binding.mojo --emit shared-lib -o .build/certified_records_ext.so"
test-orbit-census = "mojo run -I kernel tests/finite_field_orbit/test_orbit_census.mojo"
test-orbit-reference = { cmd = "python -m pytest -q tests/finite_field_orbit/test_orbit_reference.py", depends-on = ["build-certified-records-py"] }
orbit-vectors = { cmd = "python tools/make_orbit_vectors.py", depends-on = ["build-certified-records-py"] }
test-angle-doubling = "mojo run -I kernel tests/angle_doubling/test_angle_doubling.mojo"
test-projective = "mojo run -I kernel tests/projective/test_projective.mojo"
test-machine-int = "mojo run -I kernel tests/finite_exact/test_machine_int.mojo"
test-integer-matrix = "mojo run -I kernel tests/finite_linear_algebra/test_integer_matrix.mojo"
test-integer-vector = "mojo run -I kernel tests/finite_linear_algebra/test_integer_vector.mojo"
test-finite-automata = "mojo run -I kernel tests/finite_automata/test_dfa.mojo"
test-finite-graph = "mojo run -I kernel tests/finite_graph/test_scc.mojo && mojo run -I kernel tests/finite_graph/test_signing.mojo"
test-claims = "python -m pytest -q tests/mojo_smoke/test_claims_receipts.py"
test-mojo-smoke = "mojo run -I kernel tests/mojo_smoke/test_report.mojo"
test-parallel-fold = "mojo run -I kernel tests/parallel_fold/test_map_fold.mojo"
test-weighted-cycle = "mojo run -I kernel tests/weighted_graph/test_cycle_gain.mojo"
test-vendoring = "python -m pytest -q tests/vendoring"
test-proof-records = "python -m pytest -q tests/proof_records"
vocabularies = "python -m pytest -q tests/proof_records/test_vocabularies.py"
test-python = { cmd = "python -m pytest -q tests/toolchain tests/finite_exact tests/certified_records tests/proof_records tests/substitution_dynamics tests/rational_dynamics tests/closed_interval tests/quadratic_orbit tests/projective_limits tests/cyclotomic tests/finite_polynomial tests/polyglot", depends-on = ["build-certified-records-py"] }
cyclotomic-vectors = "python tools/make_cyclotomic_vectors.py --check"
cyclotomic-field-vectors = "python tools/make_cyclotomic_field_vectors.py --check"
test-cyclotomic-field = "mojo run -I kernel tests/finite_polynomial/test_cyclotomic_field.mojo && mojo run -I kernel tests/finite_polynomial/test_cyclotomic_field_vectors.mojo"
test-audit = "PYTHONPATH=tools python -m pytest -q tests/audit"
test-provenance = "python -m pytest -q tests/provenance"
test-references = "python -m pytest -q tests/references"
test-exact-arithmetic-audit = "python -m pytest -q tests/exact_arithmetic_audit"
test-refinement = "python -m pytest -q tests/oracle_refinement"
test-frontier = "python -m pytest -q tests/frontier"
bench-frontier = "python experiments/frontier/harness.py run ff_orbit_census --corpus bench"
distribution = "python oracles/property_oracle.py --layers zq --distribution"
references = "python tools/check_references.py"
mojo-issue-evidence = "python experiments/mojo_issues/uninit_associated_type/evidence.py"
test = { depends-on = ["test-finite-exact", "test-interval", "test-linear-algebra", "test-finite-polynomial", "test-cyclotomic-q", "test-quadratic-germ", "test-cyclotomic-field", "test-integer-module", "test-madic", "test-madic-oracle", "test-qpoly", "test-qpoly-oracle", "test-substitution", "test-tuning", "test-facades", "test-quadratic-orbit", "test-rational-dynamics", "test-projective-limits", "test-certified-records", "test-orbit-census", "test-orbit-reference", "test-angle-doubling", "test-projective", "test-machine-int", "test-integer-matrix", "test-integer-vector", "test-finite-automata", "test-finite-graph", "test-claims", "test-mojo-smoke", "test-parallel-fold", "test-weighted-cycle", "test-vendoring", "test-proof-records", "test-python", "test-audit", "test-provenance", "test-references", "test-exact-arithmetic-audit", "test-refinement", "test-frontier", "cyclotomic-vectors", "cyclotomic-field-vectors", "property"] }

# The polyglot lane of docs/polyglot-orbit-census-design.md. Separate from the
# default environment so the authoritative gates above neither gain nor lose a
# dependency. The Bend 2 challenger builds with the same pinned `bend` the Lane A
# harness uses (.github/actions/install-bend), and TLC comes from TLA_TOOLS. The
# gates fail, never skip, when either is missing.
[feature.polyglot.dependencies]
elixir = ">=1.18"
openjdk = ">=17"

[feature.polyglot.activation.env]
ELIXIR_ERL_OPTIONS = "+fnu"

[feature.polyglot.tasks]
build-census = "mkdir -p .build && mojo build -I kernel experiments/frontier/census_cli.mojo -o .build/census_cli"
build-census-bend = "mkdir -p .build && bend experiments/frontier/census.bend -o .build/census-bend2"
test-orbit-bend = { cmd = "FRONTIER_BEND_BIN=$PIXI_PROJECT_ROOT/.build/census-bend2 python -m pytest -q tests/finite_field_orbit/test_bend_census.py", depends-on = ["build-census-bend", "build-certified-records-py"] }
test-orchestrator = { cmd = "FRONTIER_MOJO_BIN=$PIXI_PROJECT_ROOT/.build/census_cli FRONTIER_BEND_BIN=$PIXI_PROJECT_ROOT/.build/census-bend2 mix test --warnings-as-errors", cwd = "experiments/frontier/orchestrator", depends-on = ["build-census", "build-census-bend"] }
test-choreography = "python -m pytest -q tests/finite_field_orbit/test_choreography.py"
test-polyglot = { depends-on = ["test-orbit-bend", "test-orchestrator", "test-choreography"] }

[environments]
polyglot = ["polyglot"]
