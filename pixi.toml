[workspace]
name = "finite-math-kernels"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
modular = ">=26.6.0.dev2026090805,<27"
python = ">=3.11"
pytest = "*"

[tasks]
property = "python tools/property_oracle.py --layers zq"
replay = "python tools/replay_mojo.py"
provenance = "python tools/provenance.py --update"
ledgers = "python tools/make_ledger_example.py"
test-finite-exact = "mojo run -I . tests/finite_exact/test_finite_exact.mojo"
test-interval = "mojo run -I . tests/interval/test_interval_q.mojo"
test-linear-algebra = "mojo run -I . tests/finite_linear_algebra/test_finite_linear_algebra.mojo"
test-madic = "mojo run -I . tests/finite_linear_algebra/test_madic_ball.mojo"
test-madic-oracle = "python -m pytest -q tests/finite_linear_algebra/test_madic_oracle.py"
test-substitution = "mojo run -I . tests/substitution_dynamics/test_substitution_dynamics.mojo"
test-tuning = "mojo run -I . tests/substitution_dynamics/test_tuning.mojo"
test-facades = "mojo run -I . tests/facades/test_stable_facades.mojo"
test-quadratic-orbit = "mojo run -I . tests/quadratic_orbit/test_quadratic_orbit.mojo"
test-orbit-census = "mojo run -I . tests/finite_field_orbit/test_orbit_census.mojo"
test-orbit-reference = "python -m pytest -q tests/finite_field_orbit/test_orbit_reference.py"
orbit-vectors = "python tools/make_orbit_vectors.py"
test-mojo-smoke = "mojo run -I . tests/mojo_smoke/test_report.mojo"
test-parallel-fold = "mojo run -I . tests/parallel_fold/test_map_fold.mojo"
test-vendoring = "python -m pytest -q tests/vendoring"
test-proof-records = "python -m pytest -q tests/proof_records"
vocabularies = "python -m pytest -q tests/proof_records/test_vocabularies.py"
test-python = "python -m pytest -q tests/finite_exact tests/proof_records tests/substitution_dynamics"
test-audit = "PYTHONPATH=audit python -m pytest -q tests/audit"
test-provenance = "python -m pytest -q tests/provenance"
test-references = "python -m pytest -q tests/references"
test-refinement = "python -m pytest -q tests/oracle_refinement"
test-frontier = "python -m pytest -q tests/frontier"
bench-frontier = "python benchmarks/frontier/harness.py run ff_orbit_census --corpus bench"
distribution = "python tools/property_oracle.py --layers zq --distribution"
references = "python tools/check_references.py"
test = { depends-on = ["test-finite-exact", "test-interval", "test-linear-algebra", "test-madic", "test-madic-oracle", "test-substitution", "test-tuning", "test-facades", "test-quadratic-orbit", "test-orbit-census", "test-orbit-reference", "test-mojo-smoke", "test-parallel-fold", "test-vendoring", "test-proof-records", "test-python", "test-audit", "test-provenance", "test-references", "test-refinement", "test-frontier", "property"] }

# The polyglot lane of docs/polyglot-orbit-census-design.md. Separate from the
# default environment so the authoritative gates above neither gain nor lose a
# dependency. The Bend 2 challenger builds with the same pinned `bend` the Lane A
# harness uses (.github/actions/install-bend), and TLC comes from TLA_TOOLS. The
# gates fail, never skip, when either is missing.
[feature.polyglot.dependencies]
elixir = ">=1.18"
openjdk = ">=17"

[feature.polyglot.activation.env]
ELIXIR_ERL_OPTIONS = "+fnu"

[feature.polyglot.tasks]
build-census = "mkdir -p .build && mojo build -I . benchmarks/frontier/census_cli.mojo -o .build/census_cli"
build-census-bend = "mkdir -p .build && bend benchmarks/frontier/census.bend -o .build/census-bend2"
test-orbit-bend = { cmd = "FRONTIER_BEND_BIN=$PIXI_PROJECT_ROOT/.build/census-bend2 python -m pytest -q tests/finite_field_orbit/test_bend_census.py", depends-on = ["build-census-bend"] }
test-orchestrator = { cmd = "FRONTIER_MOJO_BIN=$PIXI_PROJECT_ROOT/.build/census_cli FRONTIER_BEND_BIN=$PIXI_PROJECT_ROOT/.build/census-bend2 mix test --warnings-as-errors", cwd = "benchmarks/frontier/orchestrator", depends-on = ["build-census", "build-census-bend"] }
test-choreography = "python -m pytest -q tests/finite_field_orbit/test_choreography.py"
test-polyglot = { depends-on = ["test-orbit-bend", "test-orchestrator", "test-choreography"] }

[environments]
polyglot = ["polyglot"]
