version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "finite-math-kernels"
slug = "larsbx/finite-math-kernels"
class = "kernel"
layer = 0
band = "HARDENED"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "0833929ed82d42cf3674a1565681625a9622827b"
pin = "sha256:26ea59cf16dc775430011bc14b4b9287db0e52a769d3fedd8f93edb8cd56bbc8"

[[conform]]
id = "julia-oracle-lab"
vectors = "exact-arithmetic property transcript (zq), replayed by its Julia oracle at d694949"

[exports]
names = ["finite_exact", "finite_linear_algebra", "finite_field_orbit", "quadratic_orbit", "rational_dynamics", "substitution_dynamics", "parallel_fold", "mojo_smoke", "proof_records", "projective_limits", "weighted_graph", "claim_governance", "vendoring", "oracle_refinement", "rational-dynamics-cyclotomic-v1", "typed-proof-graph-normalization-v1"]

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# policy/provenance.json pins where every tracked file came from.
[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "ESTATE.toml"]

# Mojo include root (-I kernel). Packages here are vendored by consumers; paths inside them are package-relative.
[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "conformance"
authority = "evidence"
required = true
current = ["conformance"]

[[plane]]
id = "tests"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

# Includes claim_governance and vendoring, which consumers vendor under tools/.
[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["reference", "oracle", "audit", "proof_records", "generation"]
acceptance_authority = false

[[language]]
name = "Rust"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "Bend"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "Elixir"
authority = "supporting"
roles = ["experiment"]
acceptance_authority = false

[[language]]
name = "TLA+"
authority = "supporting"
roles = ["formal_model"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []
