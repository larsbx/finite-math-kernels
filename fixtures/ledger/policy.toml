# Example claim-governance policy for the generated ledger (audit/docs/policy-format.md).
# The head of the file is the consumer's: the status vocabulary must declare
# every class the ledger uses and a synonym for every index label. Everything
# between the generated-claims markers is written by tools/generate_ledgers.py.

[repository]
name = "larsbx/finite-math-kernels (example)"

[status]
classes = ["proved", "conditional", "imported", "finite-domain", "open-frontier", "blocked", "retired"]

[status.synonyms]
"theorem" = "proved"
"conditional" = "conditional"
"imported" = "imported"
"finite-domain" = "finite-domain"
"open" = "open-frontier"
"blocked" = "blocked"
"retired" = "retired"

# BEGIN generated claims (tools/generate_ledgers.py); do not edit between the markers
# Generated by tools/generate_ledgers.py from example.json; do not edit.

[[claim]]
name = "Census"
status = "proved"
[[claim.surfaces]]
path = "tla/Example.tla"
anchor = '"Census"'
section = "ProvedDef == {"
section_end = "}"
expect = "present"
[[claim.surfaces]]
path = "ledger-index.md"
anchor = '| Census |'
window_lines = 0

